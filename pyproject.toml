[project]
name = "sportsmanagement"
version = "0.1.0"
description = "Local MVP for multi-agent football sponsorship audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.36.0",
  "pydantic>=2.8.0",
  "pandas>=2.2.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "langgraph>=0.2.14",
  "langchain-core>=0.2.33",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.5.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]